name: CI/CD — Innovatech EKS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: innovatech-cluster

jobs:
  # ─── BUILD & PUSH ────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Generar tag de imagen
        id: tag
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push — backend-despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech/backend-despachos:$TAG \
                       -t $ECR_REGISTRY/innovatech/backend-despachos:latest \
                       ./backend-despachos
          docker push $ECR_REGISTRY/innovatech/backend-despachos:$TAG
          docker push $ECR_REGISTRY/innovatech/backend-despachos:latest

      - name: Build & Push — backend-ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech/backend-ventas:$TAG \
                       -t $ECR_REGISTRY/innovatech/backend-ventas:latest \
                       ./backend-ventas
          docker push $ECR_REGISTRY/innovatech/backend-ventas:$TAG
          docker push $ECR_REGISTRY/innovatech/backend-ventas:latest

      - name: Build & Push — frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/innovatech/frontend:$TAG \
                       -t $ECR_REGISTRY/innovatech/frontend:latest \
                       ./frontend
          docker push $ECR_REGISTRY/innovatech/frontend:$TAG
          docker push $ECR_REGISTRY/innovatech/frontend:latest

  # ─── DEPLOY ──────────────────────────────────────────────────────
  deploy:
    name: Deploy a EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl para EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Aplicar manifests de Kubernetes
        run: |
          kubectl apply -f app-k8s/k8s/namespace.yaml
          kubectl apply -f app-k8s/k8s/mysql-secret.yaml
          kubectl apply -f app-k8s/k8s/mysql-deployment.yaml
          kubectl apply -f app-k8s/k8s/mysql-service.yaml
          kubectl apply -f app-k8s/k8s/backend-despachos-deployment.yaml
          kubectl apply -f app-k8s/k8s/backend-despachos-service.yaml
          kubectl apply -f app-k8s/k8s/backend-despachos-hpa.yaml
          kubectl apply -f app-k8s/k8s/backend-ventas-deployment.yaml
          kubectl apply -f app-k8s/k8s/backend-ventas-service.yaml
          kubectl apply -f app-k8s/k8s/backend-ventas-hpa.yaml
          kubectl apply -f app-k8s/k8s/frontend-deployment.yaml
          kubectl apply -f app-k8s/k8s/frontend-service.yaml
          kubectl apply -f app-k8s/k8s/frontend-hpa.yaml
          kubectl apply -f app-k8s/k8s/ingress.yaml

      - name: Forzar rollout con nueva imagen
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          kubectl set image deployment/backend-despachos \
            backend-despachos=${{ secrets.ECR_REGISTRY }}/innovatech/backend-despachos:$TAG \
            -n innovatech
          kubectl set image deployment/backend-ventas \
            backend-ventas=${{ secrets.ECR_REGISTRY }}/innovatech/backend-ventas:$TAG \
            -n innovatech
          kubectl set image deployment/frontend \
            frontend=${{ secrets.ECR_REGISTRY }}/innovatech/frontend:$TAG \
            -n innovatech

      - name: Verificar rollout
        run: |
          kubectl rollout status deployment/backend-despachos -n innovatech --timeout=120s
          kubectl rollout status deployment/backend-ventas -n innovatech --timeout=120s
          kubectl rollout status deployment/frontend -n innovatech --timeout=120s

      - name: Obtener URL pública (ALB)
        run: |
          echo "=== URL del Ingress ==="
          kubectl get ingress -n innovatech
          kubectl get pods -n innovatech
