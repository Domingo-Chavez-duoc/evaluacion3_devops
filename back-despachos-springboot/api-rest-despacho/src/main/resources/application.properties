spring.application.name=api-rest-despacho
server.port=8081

# Inyectamos la URL y credenciales por variables de entorno (útil para Docker/K8s/Terraform)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_despachos}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true